run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gocritic
    - revive
    - misspell
    - exhaustive
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/gmixoulis/company-service
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
